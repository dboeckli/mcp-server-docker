[project]
name = "mcp-server-docker"
version = "0.4.2"
description = "A Docker MCP Server"
readme = "README.md"
dependencies = [
    "docker>=7.1.0",
    "mcp>=2,<3",
    "paramiko>=5.1,<5.2",
    "pydantic>=2.12",
]
license = { file = "LICENSE" }
keywords = ["docker", "mcp", "server"]

requires-python = ">=3.12"

classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/ckreiling/mcp-server-docker"
Issues = "https://github.com/ckreiling/mcp-server-docker/issues"

[[project.authors]]
name = "Christian Kreiling"
email = "kreiling@hey.com"

[dependency-groups]
dev = [
    "mcp[cli]>=2,<3",
    "pytest>=8.3",
    "pytest-cov>=6",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
mcp-server-docker = "mcp_server_docker:main"

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
pythonpath = ["."]
markers = [
    "integration: requires a running Docker daemon and Buildx",
]
