# Temporary: verifies the artifact actions used by release.yml, which only runs
# on tags. Delete this file before merging.
name: Artifact action check

on:
  pull_request:

permissions:
  contents: read

jobs:
  produce:
    runs-on: ubuntu-24.04
    steps:
      - name: Create the artifact payload
        run: |
          mkdir -p dist
          echo "payload" > dist/artifact.txt
      - name: Upload distributions
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  consume:
    needs: produce
    runs-on: ubuntu-24.04
    steps:
      - name: Download the artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/
      - name: Verify the payload
        run: |
          ls -l dist
          test -f dist/artifact.txt
          grep -q payload dist/artifact.txt
